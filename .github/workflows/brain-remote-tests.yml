# The kit's one piece of real code (tools/brain-remote) gets a real test gate.
# Scoped by path filter, so brains built from this template only run it when
# they actually touch the server.
name: brain-remote tests
on:
  push:
    paths: ["tools/brain-remote/**"]
  pull_request:
    paths: ["tools/brain-remote/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/brain-remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/brain-remote/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
